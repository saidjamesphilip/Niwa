<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400">
  <defs>
    <filter id="shadow-settings" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3D3229" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Main card -->
  <rect x="0" y="0" width="360" height="400" rx="12" fill="#FAF6F1" filter="url(#shadow-settings)"/>

  <!-- Header -->
  <text x="16" y="28" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#E07A5F">&#x2190; Back</text>
  <text x="180" y="28" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="15" font-weight="600" fill="#3D3229">Settings</text>
  <line x1="0" y1="40" x2="360" y2="40" stroke="#D4C5B2" stroke-width="0.5"/>

  <!-- TIMER section -->
  <text x="16" y="62" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="600" fill="#A89B8C" letter-spacing="0.5">&#x23F1;&#xFE0F; TIMER</text>

  <!-- Work row -->
  <g transform="translate(0, 72)">
    <text x="16" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#3D3229">Work</text>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="24" height="20" rx="4" fill="#F0EAE0"/>
      <text x="12" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#7A6E63">&#x2212;</text>
      <text x="48" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="600" fill="#3D3229">25</text>
      <rect x="60" y="0" width="24" height="20" rx="4" fill="#F0EAE0"/>
      <text x="72" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#7A6E63">+</text>
    </g>
    <text x="344" y="14" text-anchor="end" font-family="-apple-system, SF Pro, system-ui" font-size="11" fill="#A89B8C">min</text>
  </g>

  <!-- Short Break row -->
  <g transform="translate(0, 98)">
    <text x="16" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#3D3229">Short Break</text>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="24" height="20" rx="4" fill="#F0EAE0"/>
      <text x="12" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#7A6E63">&#x2212;</text>
      <text x="48" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="600" fill="#3D3229">5</text>
      <rect x="60" y="0" width="24" height="20" rx="4" fill="#F0EAE0"/>
      <text x="72" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#7A6E63">+</text>
    </g>
    <text x="344" y="14" text-anchor="end" font-family="-apple-system, SF Pro, system-ui" font-size="11" fill="#A89B8C">min</text>
  </g>

  <!-- Long Break row -->
  <g transform="translate(0, 124)">
    <text x="16" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#3D3229">Long Break</text>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="24" height="20" rx="4" fill="#F0EAE0"/>
      <text x="12" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#7A6E63">&#x2212;</text>
      <text x="48" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="600" fill="#3D3229">15</text>
      <rect x="60" y="0" width="24" height="20" rx="4" fill="#F0EAE0"/>
      <text x="72" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#7A6E63">+</text>
    </g>
    <text x="344" y="14" text-anchor="end" font-family="-apple-system, SF Pro, system-ui" font-size="11" fill="#A89B8C">min</text>
  </g>

  <line x1="16" y1="150" x2="344" y2="150" stroke="#D4C5B2" stroke-width="0.5"/>

  <!-- HEALTH REMINDERS section -->
  <text x="16" y="170" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="600" fill="#A89B8C" letter-spacing="0.5">&#x1F49A; HEALTH REMINDERS</text>

  <g transform="translate(0, 180)">
    <text x="16" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#3D3229">Water reminder</text>
    <text x="344" y="14" text-anchor="end" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#7A6E63">Every 30 min</text>
  </g>
  <g transform="translate(0, 206)">
    <text x="16" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#3D3229">Stand reminder</text>
    <text x="344" y="14" text-anchor="end" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#7A6E63">Every 45 min</text>
  </g>

  <line x1="16" y1="232" x2="344" y2="232" stroke="#D4C5B2" stroke-width="0.5"/>

  <!-- APPEARANCE section -->
  <text x="16" y="252" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="600" fill="#A89B8C" letter-spacing="0.5">&#x1F3A8; APPEARANCE</text>

  <g transform="translate(16, 262)">
    <text x="0" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#3D3229">Theme</text>
    <!-- Segmented control -->
    <g transform="translate(168, -2)">
      <rect x="0" y="0" width="160" height="24" rx="6" fill="#F0EAE0"/>
      <!-- System selected -->
      <rect x="2" y="2" width="52" height="20" rx="5" fill="#E07A5F"/>
      <text x="28" y="16" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="600" fill="#FAF6F1">System</text>
      <text x="80" y="16" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" fill="#7A6E63">Light</text>
      <text x="132" y="16" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" fill="#7A6E63">Dark</text>
    </g>
  </g>

  <line x1="16" y1="300" x2="344" y2="300" stroke="#D4C5B2" stroke-width="0.5"/>

  <!-- DATA section -->
  <text x="16" y="320" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="600" fill="#A89B8C" letter-spacing="0.5">&#x1F4BE; DATA</text>

  <g transform="translate(0, 330)">
    <text x="16" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#3D3229">Export JSON</text>
    <text x="344" y="14" text-anchor="end" font-family="-apple-system, SF Pro, system-ui" font-size="14" fill="#A89B8C">&#x203A;</text>
  </g>
  <line x1="16" y1="352" x2="344" y2="352" stroke="#D4C5B2" stroke-width="0.5"/>
  <g transform="translate(0, 360)">
    <text x="16" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="500" fill="#C44536">Reset All Data</text>
    <text x="344" y="14" text-anchor="end" font-family="-apple-system, SF Pro, system-ui" font-size="14" fill="#C44536">&#x203A;</text>
  </g>
</svg>