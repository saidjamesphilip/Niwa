<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420">
  <defs>
    <filter id="shadow-dark" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="xp-grad-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#E8967F"/>
    </linearGradient>
    <clipPath id="xp-clip-dark">
      <rect x="16" y="178" width="328" height="12" rx="6"/>
    </clipPath>
  </defs>

  <!-- Main card -->
  <rect x="0" y="0" width="360" height="420" rx="12" fill="#1C1917" filter="url(#shadow-dark)"/>

  <!-- Hero section -->
  <!-- Left: Bush plant + Level -->
  <g transform="translate(40, 32)">
    <!-- Bush: round bushy shape on short trunk -->
    <line x1="0" y1="60" x2="0" y2="42" stroke="#6B5B4B" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="30" rx="22" ry="18" fill="#81B29A"/>
    <ellipse cx="-10" cy="26" rx="12" ry="10" fill="#6E9E86"/>
    <ellipse cx="10" cy="28" rx="11" ry="9" fill="#4A8068"/>
    <ellipse cx="0" cy="22" rx="10" ry="8" fill="#81B29A"/>
    <!-- Soil -->
    <ellipse cx="0" cy="62" rx="14" ry="3" fill="#3D3229"/>
    <text x="0" y="82" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="14" font-weight="600" fill="#FAF6F1">Level 15</text>
    <text x="0" y="98" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" fill="#BFB3A5">Bush</text>
  </g>

  <!-- Vertical divider -->
  <line x1="130" y1="30" x2="130" y2="140" stroke="#3D3229" stroke-width="1"/>

  <!-- Right: Timer -->
  <g transform="translate(245, 72)">
    <!-- Timer ring background -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#2C2520" stroke-width="3"/>
    <!-- Timer ring filled ~67% (251.3 * 0.67 = 168.4) -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#E07A5F" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="168.4 251.3" transform="rotate(-90)"/>
    <text x="0" y="5" text-anchor="middle" font-family="SF Mono, SFMono-Regular, monospace" font-size="18" font-weight="600" fill="#FAF6F1">08:12</text>
  </g>
  <!-- Play/Skip buttons -->
  <g transform="translate(245, 128)">
    <rect x="-28" y="0" width="24" height="20" rx="4" fill="#2C2520"/>
    <polygon points="-20,5 -20,15 -12,10" fill="#E07A5F"/>
    <rect x="4" y="0" width="24" height="20" rx="4" fill="#2C2520"/>
    <polygon points="10,5 10,15 16,10" fill="#BFB3A5"/>
    <line x1="17" y1="5" x2="17" y2="15" stroke="#BFB3A5" stroke-width="1.5"/>
  </g>

  <!-- XP Bar -->
  <rect x="16" y="178" width="328" height="12" rx="6" fill="#2C2520"/>
  <g clip-path="url(#xp-clip-dark)">
    <rect x="16" y="178" width="197" height="12" rx="6" fill="url(#xp-grad-dark)"/>
  </g>
  <text x="180" y="206" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#7A6E63">Level 15 — 4200 / 6000 XP</text>

  <!-- Divider -->
  <line x1="16" y1="218" x2="344" y2="218" stroke="#3D3229" stroke-width="0.5"/>

  <!-- Tab bar -->
  <g transform="translate(0, 228)">
    <text x="60" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" font-weight="600" fill="#E07A5F">Tasks</text>
    <line x1="38" y1="19" x2="82" y2="19" stroke="#E07A5F" stroke-width="2" stroke-linecap="round"/>
    <text x="180" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#7A6E63">Notes</text>
    <text x="300" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#7A6E63">Clipboard</text>
  </g>

  <!-- Tasks -->
  <g transform="translate(16, 260)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="none" stroke="#3D3229" stroke-width="1.5"/>
    <text x="26" y="13" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#FAF6F1">Ship v2.0 release</text>
  </g>
  <g transform="translate(16, 290)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="none" stroke="#3D3229" stroke-width="1.5"/>
    <text x="26" y="13" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#FAF6F1">Write API docs</text>
  </g>
  <g transform="translate(16, 320)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#81B29A" stroke="#81B29A" stroke-width="1.5"/>
    <polyline points="3,8 6.5,12 13,4" fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="13" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#7A6E63" text-decoration="line-through">Fix auth bug</text>
  </g>

  <!-- Divider -->
  <line x1="16" y1="350" x2="344" y2="350" stroke="#3D3229" stroke-width="0.5"/>

  <!-- Health status row -->
  <g transform="translate(16, 362)">
    <text x="0" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#FAF6F1">&#x1F4A7; 5</text>
    <text x="60" y="14" font-family="-apple-system, SF Pro, system-ui" font-size="13" fill="#FAF6F1">&#x1F9CD; Standing 3:22</text>
  </g>

  <!-- Divider -->
  <line x1="16" y1="388" x2="344" y2="388" stroke="#3D3229" stroke-width="0.5"/>

  <!-- Bottom toolbar -->
  <g transform="translate(0, 395)">
    <rect x="16" y="3" width="14" height="10" rx="2" fill="none" stroke="#7A6E63" stroke-width="1.2"/>
    <rect x="23" y="7" width="5" height="4" rx="1" fill="#7A6E63"/>
    <text x="140" y="14" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#7A6E63">v1.0.0</text>
    <g transform="translate(260, 8)">
      <path d="M4,-5 A6,6 0 1,1 -4,-5" fill="none" stroke="#7A6E63" stroke-width="1.2" stroke-linecap="round"/>
      <polygon points="4,-5 6,-2 1.5,-3.5" fill="#7A6E63"/>
    </g>
    <g transform="translate(300, 8)">
      <circle cx="0" cy="0" r="3" fill="none" stroke="#7A6E63" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#7A6E63" stroke-width="1.2" stroke-dasharray="2 3.7"/>
    </g>
    <g transform="translate(336, 8)">
      <path d="M0,-6 L0,-2" stroke="#7A6E63" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-4,-4 A6,6 0 1,0 4,-4" fill="none" stroke="#7A6E63" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>