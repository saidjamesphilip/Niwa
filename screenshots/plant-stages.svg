<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200">
  <rect x="0" y="0" width="700" height="200" fill="#1a1a1a"/>

  <!-- Stage 1: Seed (L0) -->
  <g transform="translate(44, 30)">
    <!-- Soil line -->
    <ellipse cx="0" cy="80" rx="16" ry="4" fill="#3D3229"/>
    <!-- Seed -->
    <ellipse cx="0" cy="72" rx="7" ry="5" fill="#8B7B6B"/>
    <ellipse cx="-1" cy="71" rx="4" ry="3" fill="#6B5B4B"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Seed</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L0</text>
  </g>

  <!-- Stage 2: Sprout (L1-3) -->
  <g transform="translate(131, 30)">
    <ellipse cx="0" cy="80" rx="16" ry="4" fill="#3D3229"/>
    <line x1="0" y1="78" x2="0" y2="55" stroke="#81B29A" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-7" cy="58" rx="7" ry="4" fill="#81B29A" transform="rotate(-25, -7, 58)"/>
    <ellipse cx="7" cy="50" rx="7" ry="4" fill="#6E9E86" transform="rotate(20, 7, 50)"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Sprout</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L1-3</text>
  </g>

  <!-- Stage 3: Seedling (L4-7) -->
  <g transform="translate(218, 30)">
    <ellipse cx="0" cy="80" rx="16" ry="4" fill="#3D3229"/>
    <line x1="0" y1="78" x2="0" y2="40" stroke="#81B29A" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-9" cy="65" rx="8" ry="4" fill="#81B29A" transform="rotate(-30, -9, 65)"/>
    <ellipse cx="9" cy="55" rx="8" ry="4" fill="#6E9E86" transform="rotate(25, 9, 55)"/>
    <ellipse cx="-8" cy="46" rx="7" ry="3.5" fill="#4A8068" transform="rotate(-20, -8, 46)"/>
    <ellipse cx="7" cy="38" rx="7" ry="3.5" fill="#81B29A" transform="rotate(15, 7, 38)"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Seedling</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L4-7</text>
  </g>

  <!-- Stage 4: Young Plant (L8-12) -->
  <g transform="translate(305, 30)">
    <ellipse cx="0" cy="80" rx="18" ry="4" fill="#3D3229"/>
    <line x1="0" y1="78" x2="0" y2="30" stroke="#6B5B4B" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-12" cy="68" rx="10" ry="4.5" fill="#81B29A" transform="rotate(-35, -12, 68)"/>
    <ellipse cx="12" cy="58" rx="10" ry="4.5" fill="#6E9E86" transform="rotate(30, 12, 58)"/>
    <ellipse cx="-10" cy="48" rx="9" ry="4" fill="#4A8068" transform="rotate(-25, -10, 48)"/>
    <ellipse cx="10" cy="38" rx="9" ry="4" fill="#81B29A" transform="rotate(20, 10, 38)"/>
    <ellipse cx="-6" cy="30" rx="8" ry="3.5" fill="#6E9E86" transform="rotate(-15, -6, 30)"/>
    <ellipse cx="5" cy="25" rx="7" ry="3" fill="#4A8068" transform="rotate(10, 5, 25)"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Young Plant</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L8-12</text>
  </g>

  <!-- Stage 5: Bush (L13-18) -->
  <g transform="translate(392, 30)">
    <ellipse cx="0" cy="80" rx="20" ry="4" fill="#3D3229"/>
    <line x1="0" y1="78" x2="0" y2="55" stroke="#6B5B4B" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="42" rx="22" ry="18" fill="#81B29A"/>
    <ellipse cx="-10" cy="38" rx="13" ry="10" fill="#6E9E86"/>
    <ellipse cx="10" cy="40" rx="12" ry="9" fill="#4A8068"/>
    <ellipse cx="0" cy="34" rx="10" ry="8" fill="#81B29A"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Bush</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L13-18</text>
  </g>

  <!-- Stage 6: Small Tree (L19-25) -->
  <g transform="translate(479, 30)">
    <ellipse cx="0" cy="80" rx="20" ry="4" fill="#3D3229"/>
    <!-- Trunk -->
    <rect x="-4" y="48" width="8" height="32" rx="2" fill="#8B7B6B"/>
    <rect x="-3" y="50" width="3" height="28" rx="1" fill="#6B5B4B"/>
    <!-- Canopy -->
    <circle cx="0" cy="34" r="22" fill="#81B29A"/>
    <circle cx="-8" cy="30" r="12" fill="#6E9E86"/>
    <circle cx="8" cy="32" r="11" fill="#4A8068"/>
    <circle cx="0" cy="24" r="10" fill="#81B29A"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Small Tree</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L19-25</text>
  </g>

  <!-- Stage 7: Full Tree (L26-35) -->
  <g transform="translate(566, 30)">
    <ellipse cx="0" cy="80" rx="22" ry="4" fill="#3D3229"/>
    <!-- Trunk -->
    <rect x="-5" y="40" width="10" height="40" rx="2" fill="#8B7B6B"/>
    <rect x="-3" y="42" width="4" height="36" rx="1" fill="#6B5B4B"/>
    <!-- Branch stubs -->
    <line x1="-5" y1="55" x2="-12" y2="50" stroke="#8B7B6B" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5" y1="50" x2="12" y2="45" stroke="#8B7B6B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Canopy -->
    <ellipse cx="0" cy="24" rx="28" ry="22" fill="#81B29A"/>
    <circle cx="-12" cy="18" r="12" fill="#6E9E86"/>
    <circle cx="12" cy="20" r="11" fill="#4A8068"/>
    <circle cx="0" cy="12" r="12" fill="#81B29A"/>
    <circle cx="-6" cy="28" r="8" fill="#6E9E86"/>
    <circle cx="8" cy="30" r="7" fill="#4A8068"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Full Tree</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L26-35</text>
  </g>

  <!-- Stage 8: Ancient Tree (L36+) -->
  <g transform="translate(653, 30)">
    <ellipse cx="0" cy="80" rx="24" ry="5" fill="#3D3229"/>
    <!-- Roots -->
    <path d="M-6,78 Q-14,82 -20,78" fill="none" stroke="#6B5B4B" stroke-width="2" stroke-linecap="round"/>
    <path d="M6,78 Q14,82 20,78" fill="none" stroke="#6B5B4B" stroke-width="2" stroke-linecap="round"/>
    <path d="M-2,80 Q-8,86 -14,82" fill="none" stroke="#8B7B6B" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Thick trunk -->
    <rect x="-7" y="35" width="14" height="45" rx="3" fill="#8B7B6B"/>
    <rect x="-4" y="38" width="5" height="40" rx="1" fill="#6B5B4B"/>
    <!-- Branch stubs -->
    <line x1="-7" y1="52" x2="-16" y2="44" stroke="#8B7B6B" stroke-width="3" stroke-linecap="round"/>
    <line x1="7" y1="48" x2="16" y2="40" stroke="#8B7B6B" stroke-width="3" stroke-linecap="round"/>
    <line x1="-7" y1="42" x2="-13" y2="36" stroke="#8B7B6B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Wide canopy -->
    <ellipse cx="0" cy="18" rx="32" ry="24" fill="#81B29A"/>
    <circle cx="-14" cy="12" r="14" fill="#6E9E86"/>
    <circle cx="14" cy="14" r="13" fill="#4A8068"/>
    <circle cx="0" cy="6" r="14" fill="#81B29A"/>
    <circle cx="-8" cy="24" r="9" fill="#6E9E86"/>
    <circle cx="10" cy="26" r="8" fill="#4A8068"/>
    <circle cx="-20" cy="20" r="7" fill="#4A8068"/>
    <circle cx="20" cy="22" r="7" fill="#6E9E86"/>
    <text x="0" y="110" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="11" font-weight="500" fill="#888">Ancient Tree</text>
    <text x="0" y="124" text-anchor="middle" font-family="-apple-system, SF Pro, system-ui" font-size="10" fill="#666">L36+</text>
  </g>
</svg>