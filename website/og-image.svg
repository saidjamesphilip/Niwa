<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1C1917"/>
  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- App icon -->
  <g transform="translate(600, 200)">
    <rect x="-56" y="-56" width="112" height="112" rx="26" fill="#FAF6F1"/>
    <rect x="-54" y="-54" width="108" height="108" rx="24" fill="none" stroke="#E8DED1" stroke-width="1"/>
    <g transform="translate(0, 4)">
      <path d="M0,26 Q0,8 0,-4" fill="none" stroke="#E07A5F" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M0,6 Q-16,-8 -12,-24 Q-5,-16 0,-2" fill="#E07A5F"/>
      <path d="M0,-2 Q16,-14 14,-30 Q5,-22 0,-10" fill="#E07A5F"/>
      <path d="M0,14 Q-10,4 -9,-5 Q-3,2 0,10" fill="#E07A5F" opacity="0.8"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#FAF6F1">Niwa</text>
  <text x="600" y="355" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#A89B8C" letter-spacing="3">(庭)</text>

  <!-- Tagline -->
  <text x="600" y="410" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="22" fill="#D4C5B2">Grow Your Productivity</text>

  <!-- Feature pills -->
  <g transform="translate(600, 470)">
    <g transform="translate(-280, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89B8C">Pomodoro Timer</text>
    </g>
    <g transform="translate(-140, 0)">
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89B8C">Tasks</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89B8C">Notes</text>
    </g>
    <g transform="translate(140, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89B8C">Gamification</text>
    </g>
    <g transform="translate(280, 0)">
      <rect x="-60" y="-14" width="120" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)"/>
      <text text-anchor="middle" y="5" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#A89B8C">100% Offline</text>
    </g>
  </g>

  <!-- macOS badge -->
  <text x="600" y="540" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#7A6E63">Native macOS Menu Bar App</text>

  <!-- Bottom accent line -->
  <rect x="540" y="580" width="120" height="3" rx="1.5" fill="#E07A5F" opacity="0.6"/>
</svg>
