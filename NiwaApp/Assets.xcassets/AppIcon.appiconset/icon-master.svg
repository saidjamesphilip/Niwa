<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#FAF6F1"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="1008" height="1008" rx="222" fill="none" stroke="#E8DED1" stroke-width="2"/>

  <!-- Stylized plant in terracotta -->
  <g transform="translate(512, 540)">
    <!-- Main stem -->
    <path d="M0,220 C0,180 -2,100 0,-20" fill="none" stroke="#E07A5F" stroke-width="28" stroke-linecap="round"/>

    <!-- Right large leaf -->
    <path d="M0,-20 C30,-80 140,-180 130,-280 C100,-220 40,-160 0,-80" fill="#E07A5F"/>
    <!-- Right leaf vein -->
    <path d="M4,-40 C30,-100 80,-170 100,-230" fill="none" stroke="#FAF6F1" stroke-width="5" opacity="0.35" stroke-linecap="round"/>

    <!-- Left large leaf -->
    <path d="M0,30 C-30,-30 -140,-120 -120,-220 C-90,-170 -40,-100 0,-20" fill="#E07A5F"/>
    <!-- Left leaf vein -->
    <path d="M-4,10 C-30,-40 -80,-110 -95,-175" fill="none" stroke="#FAF6F1" stroke-width="5" opacity="0.35" stroke-linecap="round"/>

    <!-- Small right leaf (lower) -->
    <path d="M0,100 C25,60 100,10 90,-50 C70,-10 30,40 0,70" fill="#E07A5F" opacity="0.85"/>
    <!-- Small right vein -->
    <path d="M4,80 C20,50 55,10 68,-25" fill="none" stroke="#FAF6F1" stroke-width="4" opacity="0.3" stroke-linecap="round"/>

    <!-- Small left leaf (lower) -->
    <path d="M0,140 C-20,110 -90,50 -80,-20 C-60,20 -25,80 0,110" fill="#E07A5F" opacity="0.75"/>
    <!-- Small left vein -->
    <path d="M-3,120 C-18,85 -52,35 -62,0" fill="none" stroke="#FAF6F1" stroke-width="4" opacity="0.25" stroke-linecap="round"/>

    <!-- Ground shadow -->
    <ellipse cx="0" cy="230" rx="120" ry="20" fill="#D4C5B2" opacity="0.3"/>
  </g>
</svg>
