name: Niwa
options:
  bundleIdPrefix: com.niwa
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic

targets:
  NiwaApp:
    type: application
    platform: macOS
    sources:
      - path: NiwaApp
      - path: NiwaShared
    settings:
      base:
        PRODUCT_NAME: Niwa
        PRODUCT_BUNDLE_IDENTIFIER: com.niwa.app
        INFOPLIST_FILE: NiwaApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NiwaApp/NiwaApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: "1.3.13"
        CURRENT_PROJECT_VERSION: 13
    dependencies:
      - target: NiwaWidget

  NiwaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NiwaTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niwa.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Niwa.app/Contents/MacOS/Niwa"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: NiwaApp

  NiwaWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: NiwaWidget
      - path: NiwaShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niwa.app.widget
        INFOPLIST_FILE: NiwaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NiwaWidget/NiwaWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.3.13"
        CURRENT_PROJECT_VERSION: 13
    frameworks:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
